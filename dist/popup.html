<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Google Meet Recorder</title>
        <style>
            @keyframes expandBox {
                0% {
                    width: 140px;
                    height: 44px;
                    border-radius: 22px;
                    opacity: 0.8;
                    transform: scale(0.95);
                }
                100% {
                    width: 320px;
                    height: auto;
                    border-radius: 14px;
                    opacity: 1;
                    transform: scale(1);
                }
            }

            body {
                width: 320px;
                font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
                padding: 16px;
                background-color: rgba(24, 24, 24, 0.95);
                backdrop-filter: blur(25px);
                -webkit-backdrop-filter: blur(25px);
                color: #ffffff;
                margin: 0;
                box-sizing: border-box;
                border-radius: 14px;
                border: 1px solid rgba(255, 255, 255, 0.12);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
                animation: expandBox 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                overflow: hidden;
            }

            * {
                box-sizing: border-box;
            }
        </style>
      <script type="module" crossorigin src="/popup.js"></script>
    </head>
    <body>
        <div id="root"></div>

    </body>
</html>
